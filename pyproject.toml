[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "bma-seoul-inventory"
version = "0.1.0"
description = "Evidence-based, read-only Seoul AWS inventory for Bedrock Managed Agents"
requires-python = ">=3.12"
dependencies = [
  "boto3==1.43.118",
  "mcp==1.30.0",
  "fastapi==0.162.0",
  "uvicorn==0.54.0",
  "httpx==0.28.1",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.17.2", "pyyaml==6.0.3", "cfn-lint==1.58.0"]

[project.scripts]
aws-inventory-mcp = "aws_inventory.mcp_server:main"
bma-inventory-web = "webapp.main:main"

[tool.setuptools.packages.find]
include = ["aws_inventory*", "webapp*"]

[tool.setuptools.package-data]
webapp = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 110
extend-exclude = ["runtime/lifecycle/server.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
