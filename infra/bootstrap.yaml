AWSTemplateFormatVersion: "2010-09-09"
Description: Same-account us-east-1 build artifacts for the BMA Seoul inventory demo.
Parameters:
  RuntimeRepositoryName:
    Type: String
    Default: bma-seoul-runtime
  WebFunctionName:
    Type: String
    Default: bma-seoul-inventory-web
    AllowedPattern: "[A-Za-z0-9-_]{1,64}"
  InvestigationWorkerFunctionName:
    Type: String
    Default: bma-seoul-inventory-investigation-worker
    AllowedPattern: "[A-Za-z0-9-_]{1,64}"
    Description: Exact Event Function name allowed to read the same web deployment ZIP.
Rules:
  VirginiaOnly:
    Assertions:
      - Assert: !Equals [!Ref "AWS::Region", us-east-1]
        AssertDescription: Deploy build artifacts to us-east-1.
Resources:
  RuntimeRepository:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RepositoryName: !Ref RuntimeRepositoryName
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration: {ScanOnPush: true}
      EncryptionConfiguration: {EncryptionType: AES256}
  CodeBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration: {Status: Enabled}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
  CodeBucketTls:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref CodeBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource: [!GetAtt CodeBucket.Arn, !Sub "${CodeBucket.Arn}/*"]
            Condition: {Bool: {"aws:SecureTransport": false}}
          - Sid: AllowDesignatedWebFunctionRevisions
            Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: [s3:GetObject, s3:GetObjectVersion]
            Resource: !Sub "${CodeBucket.Arn}/web/*"
            Condition:
              ArnLike:
                "aws:SourceArn": !Sub "arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:web-function/${WebFunctionName}/revision/*"
          - Sid: AllowDesignatedInvestigationWorker
            Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: [s3:GetObject, s3:GetObjectVersion]
            Resource: !Sub "${CodeBucket.Arn}/web/*"
            Condition:
              StringEquals:
                "aws:SourceAccount": !Ref "AWS::AccountId"
              ArnLike:
                "aws:SourceArn": !Sub "arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${InvestigationWorkerFunctionName}"
Outputs:
  CodeBucket:
    Value: !Ref CodeBucket
  RuntimeRepositoryUri:
    Value: !GetAtt RuntimeRepository.RepositoryUri
